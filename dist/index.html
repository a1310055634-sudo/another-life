听TA把话说完",effects:[{money:-1500},{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:7}}],removeTags:["marriage_crisis"],addTags:["marriage_mended"]},{text:"去了两次，就不去了",summary:"咨询费交了，功课没做，问题还是那些问题",effects:[{money:-800},{attr:"happiness",delta:-1}]}]},{id:"mar_money_talk",category:"money",title:"两个人的账",text:"冰箱上贴着一张A4纸，正面是房贷和车贷，反面是水电和买菜。{name}在背面最下面添了一行：「这个月又对不上了。」TA没抬头，只说了句：「你从来没跟我讲过。」",minAge:30,maxAge:55,cooldown:5,weight:9,requires:{tagsAll:["married"],relationKinds:["spouse"]},choices:[{text:"把账户合并，定个规矩",tooltip:"共同账户 + 各自留一笔零花钱",summary:"两个人在手机银行里对着屏幕按了半小时，从此不必再对账",effects:[{money:800},{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:4}}]},{text:"只谈这个月的窟窿",summary:"窟窿补上了，谁也没提以后怎么办",effects:[{money:-300},{attr:"stress",delta:2}]},{text:"各管各的，谁也别问谁",summary:"A4纸翻回正面，背面那行字被擦掉了",effects:[{attr:"stress",delta:1},{relation:{kind:"spouse",deltaCloseness:-3}}]}]},{id:"mar_new_year_side",category:"relationship",title:"年三十的路线",text:"电视里在放倒计时，{name}的手机上躺着两条消息，一条是「来吧，今年在我们家」，一条是「妈已经包好饺子了」。TA问：「今年呢？」",minAge:28,maxAge:52,cooldown:4,weight:10,requires:{tagsAll:["married"],relationKinds:["spouse"]},choices:[{text:"两边各住一半",tooltip:"三十去这家，初一去那家",summary:"两头都跑了，两边老人都说「来都来了，别急着走」",effects:[{money:-1200},{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:3}}]},{text:"跟TA一起回TA家",summary:"那天的电视雪花比什么节目都好看",effects:[{money:-800},{attr:"happiness",delta:-1},{relation:{kind:"spouse",deltaCloseness:2}}]},{text:"谁也不回，就在家过",summary:"两个人煮了锅速冻饺子，窗外倒数声远远传进来",effects:[{attr:"happiness",delta:1},{relation:{kind:"spouse",deltaCloseness:1}}]}]},{id:"mar_handwritten_letter",category:"relationship",title:"一封手写的信",text:"{name}在抽屉最底下翻出一个信封，边角发黄，是自己十几年前写的，字迹用力到划破了纸。上面写着几行那时候不好意思说出口的话。",minAge:38,maxAge:58,cooldown:6,weight:8,requires:{tagsAll:["married"],relationKinds:["spouse"]},choices:[{text:"把这张纸递给TA看",summary:"TA看完没说话，晚上把那张纸压在了自己的台灯底座下",effects:[{attr:"happiness",delta:3},{relation:{kind:"spouse",deltaCloseness:5}}]},{text:"再写一封现在的",summary:"这回写到一半笔停了，最后一行只有一句「还是谢谢你」",effects:[{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:3}}]},{text:"撕了，夹进一本旧书里",summary:"书合上了，那几行字也就留在了十几年前",effects:[{attr:"happiness",delta:-1},{attr:"stress",delta:1}]}]},{id:"mar_money_style",category:"relationship",title:"钱袋子怎么管",text:"发了工资，账户里的钱各归各的。水电谁交、房贷谁还、人情谁出——婚姻里的经济学，从来没有标准答案，只有商量出来的活法。",minAge:28,maxAge:48,cooldown:5,weight:9,requires:{tagsAll:["married"],relationKinds:["spouse"]},choices:[{text:"开个共同账户，日子摊开来过",summary:"两张工资卡往一个账户里走，谁也没藏着掖着。账目透明了，心也透明了",effects:[{relation:{kind:"spouse",deltaCloseness:2}}]},{text:"各管各的，大头一人一半",summary:"AA 了几年，倒也清净。偶尔谁手头紧，另一人二话不说就转——各管各的，心不各的",effects:[{attr:"stress",delta:-1}]}]},{id:"mar_anniversary_upgrade",category:"relationship",title:"结婚纪念日这天",text:"日历提醒跳出来，{name}才想起今天是纪念日。往年都是一顿饭打发的今年——TA出差前留了句「看你的了」。看我的了？",minAge:30,maxAge:50,cooldown:5,weight:9,requires:{tagsAll:["married"],relationKinds:["spouse"]},choices:[{text:"补一场两个人的短途旅行",tooltip:"机票住宿 5,000 元",summary:"把娃托给老人，两人去了趟海边。没有娃在中间喊爸叫妈，突然有点不习惯——原来恋爱时的样子还在",effects:[{money:-5e3},{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:3}}]},{text:"在家做一桌TA爱吃的菜",summary:"锅碗瓢盆响了一下午。TA回家闻到味愣住：「今天什么日子来着？」——笨，但菜是真香",effects:[{attr:"happiness",delta:1},{relation:{kind:"spouse",deltaCloseness:2}}]}]},{id:"mar_double_shift",category:"relationship",title:"双职工的排班表",text:"两个人都忙，日历上的班次像两条错开的地铁线。早上谁送娃、晚上谁买菜、周末谁陪娃——婚姻的后半程，拼的是调度。",minAge:30,maxAge:48,cooldown:4,weight:9,requires:{tagsAll:["married"],relationKinds:["spouse"],careerKinds:["employed"]},choices:[{text:"错峰下班，换一顿一起吃的早餐",summary:"{name}跟主管申请了早到早走。第二天早上，三口人围着一锅粥——久违的、慢慢吃的早餐",effects:[{attr:"happiness",delta:1},{relation:{kind:"spouse",deltaCloseness:2}}]},{text:"轮流加班，把钱攒下为先",summary:"排班表贴在冰箱上，一个月轮一次。加班餐补加绩效，年底账户里的数字慢慢爬坡——苦在当下，账在未来",effects:[{money:4e3},{attr:"stress",delta:2}]}]}],Jx=[{id:"pet_vet_visit",category:"life",title:"疫苗本上的新一行",text:"TA蔫了一整天，晚饭都没碰。{name}抱着TA跑了趟宠物医院——好在只是小毛病。疫苗本上又添了一行，账单比想象中厚，心放下了。",minAge:20,maxAge:70,cooldown:3,weight:9,requires:{relationKinds:["pet"]},choices:[{text:"全套检查加疫苗，一样不落",summary:"兽医说TA很健康。{name}出门时，步子都轻了",effects:[{money:-800},{relation:{kind:"pet",deltaCloseness:2}},{attr:"happiness",delta:1}]},{text:"只看急症，疫苗下次再说",summary:"病看好了，疫苗本上的旧针还撑得了半年",effects:[{money:-400}]}]},{id:"pet_companion",category:"relationship",title:"TA好像知道",text:"{name}窝在沙发上不想动，TA踱过来，把下巴搁在{name}的膝盖上，尾巴有一搭没一搭地扫着。谁也没说话——也不需要说话。",minAge:20,maxAge:65,cooldown:3,weight:11,requires:{relationKinds:["pet"],maxAttr:{happiness:45}},choices:[{text:"带TA出去遛弯，晒晒太阳",summary:"太阳很好，TA在草地上打滚，{name}看了很久",effects:[{attr:"happiness",delta:5},{attr:"health",delta:1},{relation:{kind:"pet",deltaCloseness:3}}]},{text:"就这样抱着发会儿呆",summary:"TA的呼吸声很慢，{name}的心跳也慢了下来",effects:[{attr:"happiness",delta:3},{attr:"stress",delta:-2}]}]},{id:"pet_aging_care",category:"life",title:"TA也开始老了",text:"TA跳上沙发要助跑两步了，睡得越来越多，眼睛有点浑浊。宠物医生说TA进了老年期。{name}摸着TA的背——什么时候开始的呢。",minAge:30,maxAge:77,cooldown:2,weight:11,requires:{childStage:{kind:"pet",atLeast:10}},choices:[{text:"换老年粮，铺上软垫子",summary:"窝换到了暖气旁，TA挑了个太阳晒得到的位置",effects:[{money:-600},{relation:{kind:"pet",deltaCloseness:4}}]},{text:"推掉一次出差，在家陪TA",summary:"那几天TA总跟着{name}，从厨房跟到阳台",effects:[{attr:"stress",delta:1},{relation:{kind:"pet",deltaCloseness:6}}]},{text:"TA睡得多了，随TA去吧",summary:"日子照旧，只是饭盆旁的水碗换水勤了",effects:[{relation:{kind:"pet",deltaCloseness:-2}}]}]},{id:"pet_farewell_choice",category:"relationship",title:"饭盆还摆在墙角",text:"TA走后，家里安静得能听见时钟走字。饭盆没舍得收，扫帚从TA睡过的地方绕着走。朋友说：要不，再养一只？{name}还没想好。",minAge:24,maxAge:77,cooldown:2,weight:14,priority:2,requires:{tagsAll:["grief_pet"]},choices:[{text:"把照片装进相框，摆在窗台",summary:"阳光每天都会照到那个相框——像TA还在晒太阳",effects:[{attr:"happiness",delta:4}]},{text:"去收容所，领一只新的回家",tooltip:"不是替代，是把没给完的爱接着给",summary:"新的小家伙怯生生探出头，饭盆终于又有了动静",effects:[{money:-800},{attr:"happiness",delta:2},{relation:{kind:"pet",add:!0,addAnother:!0,closeness:45}}],removeTags:["grief_pet"]},{text:"再说说吧，现在还不行",summary:"有些空位，需要时间才能允许别人填上",effects:[{attr:"happiness",delta:-2}]}]},{id:"pet_major_care",category:"life",title:"化验单上的那个名字",text:"医生把化验单转过来，念了两行，念第二行的时候放慢了。TA不懂，但{name}听懂了——TA看{name}的表情，就全明白了。",minAge:25,maxAge:77,cooldown:8,weight:8,priority:2,requires:{relationKinds:["pet"]},choices:[{text:"倾家荡产也要治",tooltip:"不指望治好，只想让TA少难受一点",summary:"接下来三个月{name}的作息跟着TA的输液时间对齐了",effects:[{money:-3e3},{attr:"health",delta:-1},{attr:"happiness",delta:-2},{relation:{kind:"pet",deltaCloseness:3}}]},{text:"保守治疗，让TA舒服为主",summary:"止痛药按时喂，TA大部分时间睡得很安稳",effects:[{money:-900},{attr:"happiness",delta:-1}]},{text:"不想让TA受罪",summary:"兽医问「您考虑过吗」的时候，{name}点了头",effects:[{money:-600},{attr:"happiness",delta:-4},{attr:"stress",delta:2}],addTags:["grief_pet"]}]},{id:"pet_family_dispute",category:"life",title:"TA到底养不养",text:"「掉得满地都是。」「房东说了不让养。」「我妈过敏。」三句话从三个方向压过来。{name}低头看TA——TA正缩在门口，等着这个家的判决。",minAge:24,maxAge:45,cooldown:6,weight:8,requires:{relationKinds:["pet"]},choices:[{text:"带TA去做绝育，装纱窗，把问题一个个解决掉",summary:"一个月后家里多了三个滤网，TA也学会了不往沙发缝里钻",effects:[{money:-1500},{attr:"stress",delta:1},{attr:"social",delta:1},{relation:{kind:"pet",deltaCloseness:5}}]},{text:"硬扛，谁的意见都不听",summary:"矛盾还在，但TA留下了",effects:[{attr:"stress",delta:3},{attr:"happiness",delta:1},{relation:{kind:"pet",deltaCloseness:3}}]},{text:"送走，找个愿意接手的人家",summary:"临走前TA回头看了三次，直到看不见为止",effects:[{attr:"happiness",delta:-4},{attr:"social",delta:1}],addTags:["grief_pet"]}]},{id:"pet_vet_checkup",category:"life",title:"毛孩子的体检单",text:"它最近老趴着，饭量也小了。{name}翻出宠物医院的会员卡——体检这事，拖了一年又一年，不能再拖了。",minAge:20,maxAge:70,cooldown:4,weight:9,requires:{relationKinds:["pet"]},choices:[{text:"全面体检，一次做齐",tooltip:"1,200 元",summary:"指标单子上几个箭头，医生说「老了，正常，注意饮食」。{name}抱着它出来，心里那块石头落了地",effects:[{money:-1200},{attr:"happiness",delta:1}]},{text:"先观察几天，调整伙食",summary:"{name}按医生的线上建议换了粮、控制了零食。三天后它追着球跑起来——虚惊一场，也长了记性",effects:[{attr:"stress",delta:1}]}]},{id:"pet_rainy_walk",category:"life",title:"雨天的遛弯",text:"窗外下着淅淅沥沥的小雨，它叼着牵引绳在门口转圈——狗子的生物钟不会下雨休班。去，还是不去？",minAge:20,maxAge:70,cooldown:3,weight:8,requires:{relationKinds:["pet"]},choices:[{text:"穿上雨衣，照溜不误",summary:"雨衣是网购的荧光黄，它在水洼里踩得欢快。回家俩「落汤鸡」一起被擦毛——它抖毛，{name}擦手",effects:[{attr:"happiness",delta:1}]},{text:"改玩室内捡球，雨伞收起",summary:"客厅变球场，沙发变看台。它把球叼回来放在{name}脚边，尾巴摇出了残影——雨天的快乐，室内也能凑齐",effects:[{relation:{kind:"pet",deltaCloseness:1}}]}]}],Xx=[{id:"ins_buy_young",category:"money",title:"社保之外，再添一份",text:"发小在保险行业扎了根，饭桌上反复念叨：「社保是基础，重疾得自己补。」{name}翻着手机里的产品页，犹豫要不要填一份。",minAge:18,maxAge:35,once:!0,requires:{insuranceMissing:!0,healthRiskBelow:45},choices:[{text:"填一份重疾保障，一年 800，图个安心",tooltip:"建立保单：确诊即一次性给付 30,000 元",summary:"{name}签下了人生第一份保单，年缴 800，保额三万——但愿永远用不上",effects:[{money:-800},{ensureInsurance:{annualPremium:800,benefit:3e4}}]},{text:"再想想，先把钱握在手里",summary:"{name}把产品页划掉了，安心这件事，以后再说",effects:[]}]},{id:"ins_buy_mid",category:"money",title:"人到中年，保障该补齐了",text:"同学群里又有人发起水滴筹，{name}看着那条消息愣了半天，默默打开了自己一直没舍得看的保险报价——年纪越大，这一年越贵。",minAge:36,maxAge:55,once:!0,requires:{insuranceMissing:!0,healthRiskBelow:45},choices:[{text:"咬咬牙投了，一年 1600，保额四万五",tooltip:"建立保单：确诊即一次性给付 45,000 元",summary:"{name}投保了重疾保障，年缴 1600、保额四万五——中年人的安全感，按年缴计价",effects:[{money:-1600},{ensureInsurance:{annualPremium:1600,benefit:45e3}}]},{text:"报价太贵，先放一放",summary:"{name}算了算家庭开支，把报价单关掉了",effects:[]}]},{id:"ins_declined",category:"health",title:"核保没有通过",text:"{name}终于下定决心加一份保障，健康告知却卡在了体捡报告那几行箭头上——保险公司客客气气地把申请退了回来：风险太高，暂不承保。",minAge:30,maxAge:60,once:!0,requires:{healthRiskAtLeast:45,insuranceMissing:!0},choices:[{text:"把烟酒和熬夜都收一收，先把身体养起来",summary:"{name}把拒保函收进抽屉，顺手把烟盒也收了起来",effects:[{attr:"health",delta:1},{attr:"stress",delta:1}]},{text:"算了，不折腾了",summary:"{name}关掉了页面，该来的总会来",effects:[{attr:"stress",delta:1}]}]},{id:"hlt_major_surgery",category:"health",title:"住院单上的那行字",text:"复查结果出来，医生把{name}叫进办公室，指着片子上那处阴影说：建议尽快手术。住院单开出来了，费用清单上写着：预计四万。",minAge:40,maxAge:70,once:!0,requires:{healthRiskAtLeast:50},choices:[{text:"排期手术（职工医保报销后自付约 1.2 万）",requires:{careerKinds:["employed"]},tooltip:"总费用 4 万，职工医保报销 70%",summary:"{name}请了长假住了院。手术很顺利，医保报完大头，剩下的就当买回一条命",effects:[{money:-12e3},{attr:"health",delta:15},{attr:"stress",delta:-3},{claimInsurance:!0}]},{text:"排期手术（居民医保报销后自付约 2 万）",requires:{careerKinds:["student","unemployed","none"]},tooltip:"总费用 4 万，居民医保报销 50%",summary:"{name}回了老家的大医院做手术。报销完自付两万，在床上躺了一个多月，人缓过来了",effects:[{money:-2e4},{attr:"health",delta:15},{attr:"stress",delta:-3},{claimInsurance:!0}]},{text:"排期手术（退休统筹报销后自付约 6 千）",requires:{careerKinds:["retired"]},tooltip:"总费用 4 万，退休统筹报销 85%",summary:"{name}住了半个月院。退休统筹报掉了大头，自己没掏几个钱，恢复得比想象中快",effects:[{money:-6e3},{attr:"health",delta:15},{attr:"stress",delta:-3},{claimInsurance:!0}]},{text:"跟亲戚搭手做保守治疗，分两年还",tooltip:"先治后还：延迟两年各还 6,000 元",summary:"{name}跟亲戚开了口，凑齐了住院费。保守治疗三个疗程，人保住了，账也认下了",effects:[{attr:"health",delta:5},{claimInsurance:!0}],delayed:[{years:1,money:-6e3,summary:"给亲戚的还款第一笔转了过去"},{years:2,money:-6e3,summary:"治病借的钱，终于还清了"}]}]}],Zx=[{id:"home_living",category:"life",title:"自己的房子，总要修修补补",text:"梅雨季刚过，{name}发现阳台墙角洇出一小片霉斑，浴室的龙头也在夜里滴水。房子是自己的，这些事没人替你操心。",minAge:25,maxAge:70,cooldown:5,requires:{homeOwned:!0},choices:[{text:"趁周末请人修补，再刷一遍防水",tooltip:"维护开支 2,000 元",summary:"{name}找了个老师傅把霉斑和龙头一并收拾了，屋子重新干燥踏实起来",effects:[{money:-2e3},{attr:"happiness",delta:2}]},{text:"旧就旧点吧，先住着",summary:"{name}拿抹布擦了擦霉斑，龙头用盆接着——日子嘛，凑合也是一种过法",effects:[{attr:"happiness",delta:-1}]}]},{id:"home_sell_forced",category:"money",title:"挂牌，还是硬撑",text:"账户余额转负的那天，中介的电话又来了：「哥，你那房子现在行情不错，挂出来随时能走账。」{name}捏着话筒，半天没说出话。",minAge:30,maxAge:70,once:!0,requires:{homeOwned:!0,moneyBelow:0},choices:[{text:"挂牌出售，落袋为安",tooltip:"净额=现值−未偿房贷，卖房即清贷（现值不足时为负）",summary:"{name}签了委托协议。过户那天，房贷两清，卡里多了一笔卖房款——家没了，账也平了",effects:[{sellHome:!0}]},{text:"再撑一撑，房子不能卖",summary:"{name}回掉了电话。家是最后一条底线，撑不住也得撑",effects:[{attr:"stress",delta:1}]}]}],e1=[{id:"fin_fund_start",category:"money",title:"定投的格子",text:"银行 App 里那个「基金定投」的格子，{name}每次都划过去又划回来。同事说这叫「懒人理财」，行情好坏都往里放，摊平了看长期。",minAge:25,maxAge:50,once:!0,requires:{moneyAtLeast:6e3},choices:[{text:"设一年 6,000 的定投，当强制储蓄",tooltip:"每年年结自动划扣 6,000 买入，市值随行情起伏",summary:"{name}设了年投 6,000 的定投，扣款日定在发薪那天——眼不见为净",effects:[{ensureFund:{annualContribution:6e3}}]},{text:"狠一点，一年 12,000",tooltip:"每年年结自动划扣 12,000 买入，市值随行情起伏",summary:"{name}一咬牙设了年投 12,000——反正攒下来也不知道会花在哪",effects:[{ensureFund:{annualContribution:12e3}}]},{text:"看不懂的东西不碰",summary:"{name}退出了页面。看不懂的钱，赚了也不踏实",effects:[{attr:"smarts",delta:1}]}]},{id:"fin_fund_take_profit",category:"money",title:"账户飘红的那天",text:"{name}随手点开基金账户——绿了那么久，居然红了，收益率是入职第一年那次调薪都比不上的数字。心脏咚咚跳：是落袋，还是再等等？",minAge:25,maxAge:60,cooldown:4,requires:{fundOwned:!0,fundMarket:"bull"},choices:[{text:"全部赎回，落袋为安",tooltip:"市值全额入袋，基金账户注销",summary:"{name}按下了赎回。钱到账那一刻，红彤彤的数字变成了实实在在的余额",effects:[{redeemFund:!0}]},{text:"拿住，长期主义者不眨眼",summary:"{name}把 App 划走，告诫自己：拿住。至于拿不拿得住，是以后的事",effects:[{attr:"stress",delta:1}]}]},{id:"fin_fund_cut_loss",category:"money",title:"深绿的悬崖边",text:"连着半年，{name}的基金账户绿得像一片被踩过的草坪。群里有人说「破净了」、有人说「历史大底」。{name}盯着那串数字，指头悬在卖出键上。",minAge:25,maxAge:60,cooldown:4,requires:{fundOwned:!0,fundMarket:"bear"},choices:[{text:"清仓离场，从此只存定期",tooltip:"市值全额入袋（含亏损），基金账户注销",summary:"{name}含着泪点了清仓。到账的钱比投进去的少了一截，但睡得着觉了",effects:[{redeemFund:!0},{attr:"stress",delta:-2}]},{text:"跌出来的都是机会，继续定投",summary:"{name}不但没卖，还把定投档位在心里又确认了一遍——别人恐惧我贪婪",effects:[{attr:"smarts",delta:1}]}]}],_i={careerKinds:["employed"],tagsAny:["civil_servant"]},t1=[{id:"civ_exam_prep",category:"career",title:"备考的那盏灯",text:"家里人劝了第三年：「考个编吧，稳定。」{name}翻了翻招考公告——本科起步，行测申论，一年一回。书桌上的台灯，从这天起多亮两个小时。",minAge:20,maxAge:35,cooldown:2,requires:{careerKinds:["employed","unemployed","none"],tagsNone:["civil_servant"],education:["college","bachelor","master","phd"]},choices:[{text:"报个冲刺班，系统刷题",tooltip:"支出 3,000 元，标记 civil_exam_prep",summary:"{name}交了冲刺班的学费，行测的粉笔头堆满了笔筒",effects:[{money:-3e3},{addSkill:{id:"academics",delta:2}}],addTags:["civil_exam_prep"]},{text:"自己啃真题，一分钱不花",tooltip:"标记 civil_exam_prep",summary:"{name}从网上扒了十年真题，一页一页啃了下来",effects:[{addSkill:{id:"academics",delta:1}}],addTags:["civil_exam_prep"]}]},{id:"civ_exam",category:"career",title:"笔试面试放榜",text:"考场外的梧桐树下全是人，{name}攥着准考证把申论模板又默了一遍。三个月后放榜——这一纸结果，可能换一条完全不同的路。",minAge:20,maxAge:40,cooldown:1,requires:{careerKinds:["employed","unemployed","none"],tagsNone:["civil_servant"],education:["college","bachelor","master","phd"],minAcademics:45},choices:[{text:"走进考场，等一个结果",tooltip:"支出报名费 200 元；录取与学业功底相关，落榜可再战",summary:"{name}交了报名费走进了考场，笔下是自己练了千百遍的答案",effects:[{money:-200},{attr:"stress",delta:2},{civilExam:!0}]},{text:"临时怯场，弃考",summary:"{name}在考场门口站了十分钟，转身走了。备考的标记还留着，明年再说",effects:[{attr:"stress",delta:1}]}]},{id:"civ_office_politics",category:"career",title:"处室里的人情世故",text:"科长要退了，位置空出来一个。办公室里表面风平浪静，饭桌上的座次却悄悄变了。有人劝{name}「走动走动」，有人劝{name}「闷声干活」。",minAge:28,maxAge:50,cooldown:6,requires:{..._i},choices:[{text:"硬着头皮走动走动",tooltip:"人际长进，心里发堵",summary:"{name}拎着果篮串了几次门，话学会了怎么说，觉却睡得比以前少",effects:[{attr:"social",delta:3},{attr:"stress",delta:2}]},{text:"埋头把手头的材料写好",tooltip:"功底扎实，提拔另说",summary:"{name}把那篇材料改到第十一稿。领导记不记得不重要，本事长在自己身上",effects:[{addSkill:{id:"academics",delta:1}}]}]},{id:"civ_secondment",category:"career",title:"一纸借调令",text:"上面要人，名单里有{name}。借调去专班，忙是真忙，见识也是真见识——就是一年半载回不来，手头的活全得交出去。",minAge:25,maxAge:45,cooldown:6,requires:{..._i},choices:[{text:"去。苦一年，长本事",tooltip:"压力大，功底与眼界都涨",summary:"{name}抱着纸箱搬去了专班。半年下来，材料写得又快又稳，人瘦了一圈",effects:[{attr:"stress",delta:4},{attr:"happiness",delta:-1},{addSkill:{id:"academics",delta:3}}]},{text:"婉拒，把手头的事守好",summary:"{name}婉拒了借调。有人替他惋惜，他自己知道家里离不开",effects:[{attr:"happiness",delta:1}]}]},{id:"civ_ceiling",category:"career",title:"遴选的内部通知",text:"上级机关遴选的消息在小圈子里传开。符合条件的干部可以报名，笔试面试差额考察——这是体制内少有的、靠自己考出来的上升通道。",minAge:30,maxAge:55,cooldown:6,requires:{..._i},choices:[{text:"报名冲刺，答辩走起",requires:{promotionAvailable:!0},tooltip:"事件晋升（职级未满时可用）",summary:"{name}把述职材料背到滚瓜烂熟，答辩台上稳稳当当——任命下来了",effects:[{attr:"stress",delta:3},{promote:!0}]},{text:"知足留守，把日子过好",summary:"{name}没去凑这个热闹。到点上下班，把热汤热饭过成日子",effects:[{attr:"happiness",delta:1}]}]}],n1=[{id:"mc_layoff",category:"career",title:"优化名单",text:"HR 的会议邀请没有写议题。会议室里坐着的还有法务——{name}瞬间就明白了。「公司业务调整，你的岗位被优化了，N+1 的方案在这里。」",minAge:33,maxAge:40,once:!0,weight:18,requires:{careerKinds:["employed"],tagsNone:["civil_servant"]},choices:[{text:"签了。拿补偿走人",tooltip:"补偿金约 25,000 元（静态分档近似），即刻失业",summary:"{name}在方案上签了字。25,000 块补偿金到账的那天，朋友圈里全是转发的招聘帖",effects:[{money:25e3},{attr:"happiness",delta:-3},{attr:"stress",delta:2},{loseJob:!0}]},{text:"不接受，耗着争取留下",tooltip:"僵持消耗：身心俱疲，薪资下调暂保岗位",summary:"{name}拒绝签字，天天正常打卡。一个月后公司妥协了——岗位保住，薪水打折，人也熬脱了一层皮",effects:[{attr:"stress",delta:5},{attr:"health",delta:-1},{salaryMul:.9}]}]},{id:"mc_bench",category:"career",title:"去「战略研究部」报到",text:"组织架构调整的邮件里，{name}的名字被划进了新成立的「战略研究部」——没有业务、没有下属，工位挪到了打印机旁边。所有人都知道这意味着什么。",minAge:33,maxAge:40,cooldown:4,weight:18,requires:{careerKinds:["employed"],tagsNone:["civil_servant"]},choices:[{text:"坐冷板凳，趁机考证充电",tooltip:"清闲但憋屈，功底在涨",summary:"{name}把冷板凳坐成了自习室，工位抽屉里压着厚厚的题库",effects:[{attr:"stress",delta:1},{addSkill:{id:"academics",delta:2}}]},{text:"主动请缨去业务一线硬仗",summary:"{name}敲开了业务负责人的门。苦活累活自己揽，图的是名单上永远有自己",effects:[{attr:"stress",delta:3},{attr:"health",delta:-1},{attr:"social",delta:2}]}]},{id:"mc_resume",category:"career",title:"已读不回的简历",text:"投出去第四十七份简历，已读不回。猎头朋友说了实话：「35 岁往上，简历先过机器这一关。你这个年纪，要么管理岗，要么技术专家，中间层最难。」",minAge:35,maxAge:50,cooldown:3,weight:14,requires:{careerKinds:["unemployed"]},choices:[{text:"考个证，把门槛踩实",tooltip:"支出 3,000 元，功底涨",summary:"{name}报了证的书和网课，把等回复的时间换成了刷题时间",effects:[{money:-3e3},{addSkill:{id:"academics",delta:3}},{attr:"stress",delta:1}]},{text:"放下身段，从基础岗投起",summary:"{name}把期望薪资改成了原来的一半。电话开始响了，虽然岗位比从前低了两级",effects:[{attr:"happiness",delta:-2},{attr:"stress",delta:-1},{attr:"social",delta:2}]}]},{id:"mc_free_lance",category:"career",title:"给自己打工的第一天",text:"老东家的竞业协议到期了，{name}算了算手里的接单邀约——够吃到年底。全职单干，没有五险一金，也没有开不完的会。",minAge:35,maxAge:50,once:!0,requires:{careerKinds:["unemployed"]},choices:[{text:"all in 自由职业",tooltip:"首年接单收入 6,000 元，压力不小",summary:"{name}把客厅改成工作室。没有打卡机，也没有下班时间",effects:[{money:6e3},{attr:"stress",delta:2},{attr:"happiness",delta:1}]},{text:"先接零活，同时继续投简历",summary:"{name}白天跑面试，晚上接小单。两条腿走路，哪条通了走哪条",effects:[{money:2e3},{attr:"stress",delta:-1}]}]},{id:"mc_moat",category:"career",title:"新来的年轻人",text:"组里来了三个应届生，工资单上的数字让老员工们私下议论了一周。领导找{name}谈话：「带带新人，团队下一步要压担子。」——是危机，也可以是护城河。",minAge:38,maxAge:50,cooldown:6,weight:14,requires:{careerKinds:["employed"],minAcademics:70},choices:[{text:"接下带团队的担子",tooltip:"压力换位子，调薪在年后兑现",summary:"{name}开始带着三个新人啃硬骨头。年会那天，调薪通知悄悄到了账",effects:[{attr:"stress",delta:2},{addSkill:{id:"academics",delta:1}}],delayed:[{years:1,money:12e3,summary:"带队满一年，调薪兑现了"}]},{text:"当好螺丝钉，不让渡生活",summary:"{name}带完手头最后一个小项目就撤了。职级原地踏步，晚饭倒是一顿没落下",effects:[{attr:"happiness",delta:1}]}]}],a1=[{id:"city_graduate_run",category:"life",title:"去大城市闯闯",text:"行李箱的轮子在地砖上哒哒作响。高铁票上的终点是一座{name}只在新闻里见过的城市——三个小时的距离，两种完全不同的人生报价。",minAge:18,maxAge:26,once:!0,requires:{careerKinds:["employed","unemployed","none"],cityIn:["hometown"]},choices:[{text:"买票，走",tooltip:"安家开销 3,000 元；一线薪资 ×1.35、生活成本 ×1.3、房价增值 ×1.5 档",summary:"{name}在大城市城中村的隔断间里铺好了床单。这里的钱好挣，也不经花",effects:[{money:-3e3},{attr:"happiness",delta:-1},{attr:"stress",delta:2},{setCity:"metro"}]},{text:"留下来，离家近的日子不折腾",summary:"{name}退了票。家门口的日子一眼能望到头，但胜在踏实",effects:[{attr:"happiness",delta:1},{attr:"social",delta:2}]}]},{id:"city_drift_tired",category:"life",title:"北漂的第十个年头",text:"合租房的隔音棉又掉了一块。凌晨加班回来，{name}在楼下便利店买了关东煮，手机里是母亲发来的「隔壁小王在省城买房了」。",minAge:28,maxAge:40,cooldown:4,requires:{careerKinds:["employed","unemployed"],cityIn:["metro"],tagsNone:["homeowner"]},choices:[{text:"收拾行李，去省城重新开始",tooltip:"搬家费 2,000 元；省城薪资 ×1.15、生活成本 ×1.1",summary:"{name}把三年攒下的行李压缩成两个箱子。省城的房子租金便宜了一半，晚上能睡整觉了",effects:[{money:-2e3},{attr:"happiness",delta:2},{setCity:"province"}]},{text:"咬牙留下，再冲两年",tooltip:"一线的机会与房租一起涨",summary:"{name}续了一年的租约。关东煮的热气糊住了眼镜——再冲两年，就两年",effects:[{money:-2e3},{attr:"stress",delta:2}]}]},{id:"city_province_hq",category:"career",title:"老家省会的 offer",text:"省城一家公司的电话打了过来：岗位对口，薪资在当地排得上号，「就是比不上你现在的城市」。{name}翻着手机里省会双子楼的照片，认真想了想。",minAge:25,maxAge:35,once:!0,requires:{careerKinds:["employed","unemployed","none"],cityIn:["hometown"]},choices:[{text:"去省城，离家近事业也不耽误",tooltip:"安家开销 2,500 元；省城薪资 ×1.15、生活成本 ×1.1",summary:"{name}拖着行李箱到了省会。高铁回家四十分钟，工资单上的数字也比老家精神了不少",effects:[{money:-2500},{attr:"social",delta:2},{setCity:"province"}]},{text:"留在家乡，守着眼下的一切",summary:"{name}婉拒了对方。家门口的一亩三分地，种点踏实的日子",effects:[{attr:"happiness",delta:1}]}]},{id:"city_return_retire",category:"life",title:"返乡的机票",text:"退休手续办完那天，{name}在阳台上看了一场这个城市最完整的日落。第二天，机票和老家亲戚「回来住吧」的语音一起，摆在了眼前。",minAge:50,maxAge:75,once:!0,requires:{careerKinds:["retired"],cityIn:["metro","province"]},choices:[{text:"回去。叶落归根",tooltip:"搬家费 2,000 元；老家生活成本 ×1.0",summary:"{name}把城市的家具送了人。老家的院子扫得很干净，早晚的空气都是甜的",effects:[{money:-2e3},{attr:"happiness",delta:3},{setCity:"hometown"}]},{text:"城市住惯了，不折腾",summary:"{name}把机票退了。这里的水果贵一点，但医院和地铁都在楼下",effects:[{attr:"happiness",delta:1}]}]}],r1=[{id:"div_sign_papers",category:"relationship",title:"离婚协议书",text:"冷战第 N 个月，两本结婚证并排放在餐桌上。{name}和TA都清楚：签了，这段日子就翻篇了；不签，日子还得这样耗着。",minAge:30,maxAge:50,once:!0,priority:2,weight:14,requires:{tagsAll:["married","marriage_crisis"],relationKinds:["spouse"]},choices:[{text:"签。好聚好散",tooltip:"现金 50% 分割（负资产同担）；子女抚养共同承担；恢复单身",summary:"{name}在协议书上签了字。走出民政局的时候，天特别亮，风特别冷",effects:[{divorce:!0}]},{text:"再给这半年一次机会",summary:"{name}把协议书推了回去。也许熬过这个冬天，会不一样",effects:[{attr:"stress",delta:1}]}]},{id:"div_single_life",category:"relationship",title:"一个人的日子",text:"离婚后的第 N 个周末，{name}把家里重新布置了一遍——所有东西都只放自己够得着的位置。原来一个人过，也可以过得很讲究。",minAge:30,maxAge:55,cooldown:4,requires:{divorced:!0},choices:[{text:"把钱和时间都花给自己",summary:"{name}给自己买了那件一直舍不得的东西——取悦自己这件事，不用等谁",effects:[{money:-1e3},{attr:"happiness",delta:2}]},{text:"相亲角转转，不设防的那种",summary:"{name}去了趟相亲角。没遇上合适的，倒是从大爷大妈的报价里看懂了不少人间",effects:[{attr:"social",delta:2},{attr:"stress",delta:1}]}]},{id:"div_remarry",category:"relationship",title:"第二次说什么",text:"和现在的TA在一起一年多了，{name}比任何时候都确定。婚礼很简单——经历过一次的人都知道，重要的不是仪式，是那个人。",minAge:35,maxAge:60,once:!0,requires:{divorced:!0,relationKinds:["partner"],relationKindsNone:["spouse"]},choices:[{text:"领证。这次是真的",tooltip:"花销 8,000 元；恢复已婚",summary:"{name}和TA领了证，没有仪式，只有两本红色的本子和一顿家常饭",effects:[{money:-8e3},{attr:"happiness",delta:6},{relation:{kind:"spouse",convertFrom:"partner"}}],requires:{moneyAtLeast:8e3},addTags:["married"],removeTags:["divorced"]},{text:"再处一段时间，不急",summary:"{name}觉得现在这样刚刚好。名分这种事，急不来",effects:[{attr:"happiness",delta:1}]}]},{id:"fam_dink",category:"relationship",title:"两个人，也很好",text:"亲戚的「什么时候要孩子」问了一年又一年。这一次，{name}和TA认真地谈了一个晚上——两个人把日子过成想要的样子，也是一种完整。",minAge:28,maxAge:35,once:!0,requires:{tagsAll:["married"],relationKinds:["spouse"],relationKindsNone:["child"]},choices:[{text:"说好了，做丁克",tooltip:"丁克约定：不再被生育议题打扰",summary:"{name}和TA达成了共识——两个人的世界，自有两个人的丰盛",effects:[{attr:"happiness",delta:2}],addTags:["dink"]},{text:"顺其自然，不刻意",summary:"{name}和TA决定不把话说死。日子往前走，走到哪算哪",effects:[{attr:"stress",delta:-1}]}]},{id:"life_childfree",category:"relationship",title:"想明白了",text:"又一场同学婚礼散场。{name}在回家路上把这件事想透了——结婚不是人生的必答题，把一个人的日子过明白，比什么都强。",minAge:30,maxAge:45,once:!0,requires:{relationKindsNone:["partner","spouse"]},choices:[{text:"就这样，把自己活明白",tooltip:"不婚约定：不再被催婚议题左右",summary:"{name}给生活做了减法——想要的自然而然，不想求的敬而远之",effects:[{attr:"happiness",delta:2},{attr:"stress",delta:-1}],addTags:["childfree_will"]},{text:"话不说死，缘分随缘",summary:"{name}想归想，还是留了一扇窗。谁说得准呢",effects:[{attr:"happiness",delta:-1}]}]}],s1=[{id:"ab_choice",category:"education",title:"一封录取邮件",text:"海外一年制硕士的 offer 躺在邮箱里：排名不算顶尖，但签证官认、学历认证也认。学费加生活费，一年二十万起。{name}盯着屏幕上的数字，算了一遍又一遍。",minAge:20,maxAge:30,once:!0,weight:12,requires:{education:["bachelor","master","phd"],minAttr:{smarts:60},moneyAtLeast:2e5,careerKinds:["student","employed","unemployed","none"]},choices:[{text:"自费去读，一年磨一剑",tooltip:"学费生活费 200,000 元；海外历练 smarts 大涨",summary:"{name}辞别家人登陆机场。二十万换来的一年，值不值，要很多年后才知道",effects:[{money:-2e5},{attr:"stress",delta:2}],addTags:["abroad_year"]},{text:"办教育贷款，赌一个更好的起点",tooltip:"押金 20,000 元，学贷分三年还清（每年 60,000）；压力更大",summary:"{name}签了教育贷款合同。这一把，押上的是未来三年的工资单",effects:[{money:-2e4},{attr:"stress",delta:4}],delayed:[{years:1,money:-6e4,summary:"留学贷款第一期扣款，毫不留情"},{years:2,money:-6e4,summary:"留学贷款第二期，吃土也要还"},{years:3,money:-6e4,summary:"最后一期学贷还清，如释重负"}],addTags:["abroad_year"]},{text:"算了吧，成本太高",summary:"{name}关掉了邮箱。有些路，注定只能远远看一眼",effects:[{attr:"smarts",delta:1}]}]},{id:"ab_study",category:"education",title:"图书馆的凌晨",text:"全英文的文献、听不全懂的lecture、超市打折时段的作息——{name}在异国的图书馆熬过一个个凌晨，论文过了的那天，人在楼梯间哭得像个孩子。",minAge:20,maxAge:32,once:!0,weight:14,requires:{tagsAll:["abroad_year"]},choices:[{text:"毕业归国，学历到手",tooltip:"smarts 大涨；学历升至上硕（本科起点）；海归身份求职有加成",summary:"{name}穿上学士服拍完最后一组照片，行李箱里装着学位证和一整个人的脱胎换骨",effects:[{setEducation:"master"},{addSkill:{id:"academics",delta:4}},{attr:"smarts",delta:6},{attr:"stress",delta:-2}],addTags:["returnee","studied_abroad"],removeTags:["abroad_year"]},{text:"实在撑不下去，休学回国",tooltip:"放弃学业：无海归标记，情绪代价大",summary:"{name}拖着没拆封的行李回国了。这一年的账单和遗憾，都得自己慢慢消化",effects:[{attr:"happiness",delta:-3},{attr:"stress",delta:2}],removeTags:["abroad_year"]}]},{id:"ab_job_hunt",category:"career",title:"海归的简历",text:"留学归来的{name}把简历投进了几家外企和大厂。HR 回复的速度明显比从前快——「海归背景，优先约面」这行字，第一次让留学这件事有了现价的回报。",minAge:24,maxAge:40,once:!0,weight:12,requires:{tagsAll:["returnee"]},choices:[{text:"接受外企 offer，签字费到账",tooltip:"签字费 8,000 元；在职则调薪 1.05",summary:"{name}入职了外企。签字费到账的短信提示音，听着像对那一年的迟到补偿",effects:[{money:8e3},{attr:"social",delta:2},{salaryMul:1.05}]},{text:"婉拒外企，投奔国内公司",summary:"{name}选了家国内公司。海归的牌子没换来溢价，但换来了一句「我们更看中你的独立」",effects:[{money:2e3},{addSkill:{id:"academics",delta:2}}]}]},{id:"ab_gap",category:"career",title:"「海归」变「海待」",text:"回来的第三个月，{name}的简历还是只进不出。留学群里有人自嘲：出去的时候叫海归，找不到工作就叫海待了。{name}笑不出来。",minAge:24,maxAge:38,once:!0,requires:{tagsAll:["returnee"],careerKinds:["unemployed","none"]},choices:[{text:"调整预期，从眼前做起",tooltip:"心态落地，stress 缓解",summary:"{name}把简历上的「海归」二字删了，从力所能及的岗位重新投起。路是一步一步走宽的",effects:[{attr:"happiness",delta:-2},{attr:"stress",delta:-2}]},{text:"不服，二次冲刺考研考编",tooltip:"功底再涨，但压力更大",summary:"{name}把行李箱重新打开——这次的目标是国内的研究生名额。败过一次的人，不怕再熬一年",effects:[{addSkill:{id:"academics",delta:3}},{attr:"stress",delta:3}]}]},{id:"voc_night_school",category:"education",title:"夜校的技术班",text:"技校的夜间进修班贴出了招生简章：PLC 编程、数控机床、电工进阶——上课时间晚间七点到九点，不耽误白天的活。{name}盯着简章看了很久。",minAge:22,maxAge:45,cooldown:4,requires:{careerKinds:["employed"]},choices:[{text:"报名，把技术往深里学",tooltip:"学费 3,000 元；职业技能 +12",summary:"{name}每晚骑四十分钟电动车去上课，笔记本上全是图纸和参数",effects:[{money:-3e3},{addSkill:{id:"vocational",delta:12}},{attr:"stress",delta:2}]},{text:"问清楚再做决定，先不了",summary:"{name}把简章折好放进了工具包。也许明年，也许用不上",effects:[{attr:"smarts",delta:1}]}]},{id:"voc_craft_master",category:"career",title:"老师傅的名号",text:"厂里的进口设备出了疑难故障，外方工程师远程都没搞定，最后是{name}上手听声辨位修好的。车间主任拍板：技术攻关小组，{name}来牵头。",minAge:30,maxAge:50,cooldown:8,requires:{careerKinds:["employed"],minVocational:70},choices:[{text:"牵头攻关，把名号打出去",tooltip:"压力不小；一年后调薪 12,000 元兑现",summary:"{name}带队啃下了这块硬骨头。「有难题找{name}」，从此在厂里成了口号",effects:[{attr:"stress",delta:2},{attr:"happiness",delta:1}],delayed:[{years:1,money:12e3,summary:"技术攻关的调薪批下来了，实至名归"}]},{text:"把手艺守好就行，出头让别人来",summary:"{name}婉拒了牵头。手艺在身，心里不慌——平静也是种回报",effects:[{attr:"happiness",delta:1}]}]}],i1=[{id:"fame_start",category:"career",title:"注册了一个账号",text:"深夜刷手机的时候，{name}刷到一条「普通人也能做自媒体」的视频。手指在「立即注册」上停了停——白天上班/上学，晚上剪视频，好像……可以试试？",minAge:18,maxAge:45,once:!0,requires:{careerKinds:["employed","student","unemployed","none"],tagsNone:["minor_fame","creator_started"]},choices:[{text:"认真运营，设备先置办起来",tooltip:"设备 2,000 元；压力+2；标记 creator_started（进入走红判定）",summary:"{name}下单了支架和麦克风。第一条视频的播放量：27",effects:[{money:-2e3},{attr:"stress",delta:2}],addTags:["creator_started"]},{text:"随手发发，先试试水",tooltip:"标记 creator_started（进入走红判定）；更新慢，走红概率不变但节奏随缘",summary:"{name}用手机随手注册发了第一条日常。播不播得出圈，随缘",effects:[{attr:"social",delta:1}],addTags:["creator_started"]}]},{id:"fame_update",category:"career",title:"周更的坚持",text:"账号更新是个磨人的活：白天的事忙完，晚上还得剪片、写文案、盯评论。{name}盯着后台两条刺眼的评论「就这水平也学人做博主」，把下周的选题表又填满了一页。",minAge:18,maxAge:48,cooldown:1,requires:{tagsAny:["creator_started"],tagsNone:["minor_fame"]},choices:[{text:"继续更，风雨无阻",tooltip:"stress+1；坚持中，走红窗每年 35%",summary:"{name}把「就这水平」截图设成了手机壁纸，然后照常更新",effects:[{attr:"stress",delta:1}]},{text:"算了，弃坑",tooltip:"移除创作者标记，回到普通生活",summary:"{name}卸载了剪辑软件。曾经的热血，变成了账号里最后一条「感谢关注」",effects:[{attr:"happiness",delta:1}],removeTags:["creator_started"]}]},{id:"fame_viral",category:"career",title:"那条视频爆了",text:"一条随手发的视频一夜之间冲上了热门。评论区涌进几万人，私信提示红得发烫，还有 MCN 机构发来合作邀请。{name}盯着那条几百万播放的数据，手都在抖。",minAge:18,maxAge:48,cooldown:6,weight:14,requires:{tagsAny:["creator_started"],fameChance:"viral"},choices:[{text:"接住这泼天的流量，正式做号",tooltip:"minor_fame 标记：后续变现与风浪随之而来",summary:"{name}回复了 MCN 的邀约。从这天起，{name}是有粉丝的人了",effects:[{attr:"happiness",delta:4},{attr:"social",delta:3}],addTags:["minor_fame"],removeTags:["creator_started"]},{text:"慌了，连夜删号跑路",tooltip:"放弃走红：移除创作者标记",summary:"{name}看着涌进来的陌生人和质疑声，手一抖点了注销。热度散得比来得还快",effects:[{attr:"happiness",delta:-2},{attr:"stress",delta:-2}],removeTags:["creator_started"]}]},{id:"fame_cash",category:"career",title:"第一条商单",text:"品牌方发来的合作邮件写得客客气气，报价也可观。{name}盯着合同里的「品牌调性一致」几个字，第一次认真思考：这条广告，接还是不接？",minAge:18,maxAge:50,cooldown:4,requires:{tagsAny:["minor_fame"]},choices:[{text:"接下商单，认真出片",tooltip:"广告收入 8,000 元",summary:"{name}拍完了第一条商单。粉丝评论区有人捧有人骂，但账单不会骗人",effects:[{money:8e3},{attr:"happiness",delta:1},{attr:"stress",delta:1}]},{text:"只接真心喜欢的东西，佛系更新",tooltip:"零星打赏 2,000 元",summary:"{name}回绝了大部分商单，只留下一个真心喜欢的小品牌。钱少，但内容干净",effects:[{money:2e3},{attr:"happiness",delta:1}]}]},{id:"fame_hate",category:"relationship",title:"被挂上了热搜",text:"一段掐头去尾的视频把{name}挂上了热搜，评论区涌进数万陌生人，最难听的话得了最高赞。没有人在意真相，他们只是需要一个可以攻击的对象。",minAge:18,maxAge:50,cooldown:4,requires:{tagsAny:["minor_fame"],fameChance:"hate"},choices:[{text:"不回应，让时间过去",tooltip:"stress+3、happiness−4；名声保留",summary:"{name}关掉了评论区，删了 App。互联网的记忆很短，但那几天的每一分钟都很长",effects:[{attr:"stress",delta:3},{attr:"happiness",delta:-4}]},{text:"发澄清声明，然后停更一阵",tooltip:"移除 minor_fame：热度与黑子一起退潮",summary:"{name}发了条长文澄清，然后停更了。支持者还在，但{name}需要一段没有镜头的日子",effects:[{attr:"stress",delta:-2},{attr:"happiness",delta:-2}],removeTags:["minor_fame"]}]},{id:"fame_fade_out",category:"career",title:"过气的念头",text:"后台的粉丝数停在一个不再变动的数字上很久了。商单邮件上次来还是半年前，评论区最常见的留言从「更新！」变成了「博主还活着吗」。{name}盯着这个自己一手养起来的账号，第一次认真想到那个词：过气。",minAge:40,maxAge:50,cooldown:8,weight:10,requires:{tagsAny:["minor_fame"]},choices:[{text:"体面谢幕，置顶一条告别",tooltip:"主动摘除 minor_fame：回到普通生活",summary:"{name}写了条长长的告别，置顶。按下发送的那一刻，心里松了一口气",effects:[{attr:"happiness",delta:2},{attr:"stress",delta:-2}],removeTags:["minor_fame"]},{text:"转型慢更，只记录生活",tooltip:"名声保留；不再追热点，压力小了",summary:"{name}把简介里的「周更」删掉，改成「想更就更」。掉粉，但睡得着了",effects:[{attr:"stress",delta:-1},{attr:"happiness",delta:1}]},{text:"不服，再冲一次",tooltip:"投 1,000 元推广；stress+2",summary:"{name}研究了一整晚「流量密码」，投了一笔推广。数据涨了一点，又落回去——但至少试过",effects:[{money:-1e3},{attr:"stress",delta:2}]}]},{id:"fame_past_peak",category:"life",title:"被翻出来的旧视频",text:"饭桌前刷手机，{name}刷到一条熟悉的画面——自己几年前爆过的那条视频，被人剪进了「互联网怀旧合集」，弹幕飘过一排「爷青回」。点赞最高的评论问：这位后来去哪了？{name}把手机扣在桌上，饭还是热的。",minAge:42,maxAge:54,cooldown:6,weight:9,requires:{tagsAny:["minor_fame"]},choices:[{text:"在评论区悄悄回一句「过得不错」",tooltip:"happiness+2",summary:"那条回复收到三百多个赞。原来还有人记得。{name}关掉手机，自己笑了一会儿",effects:[{attr:"happiness",delta:2}]},{text:"看完就关，不留痕迹",tooltip:"stress−1",summary:"{name}看完了整条合集。那阵风早吹过去了，日子是自己的",effects:[{attr:"stress",delta:-1}]},{text:"有点不是滋味，那顿饭没怎么说话",tooltip:"happiness−1",summary:"「后来去哪了」——去哪了呢。那晚的饭，{name}吃得有点慢",effects:[{attr:"happiness",delta:-1}]}]}],l1=[{id:"mood_low_tide",category:"life",title:"看不见抓手的日子",text:"说不清是哪天开始的。{name}早上不想睁眼，晚上舍不得关灯——好像只要不睡着，今天就还没结束。朋友的消息堆在锁屏上，一个都没回。不是不想说话，是不知道说什么。",minAge:18,maxAge:70,cooldown:3,weight:12,requires:{maxAttr:{happiness:35},minAttr:{stress:65},tagsNone:["low_mood"]},choices:[{text:"就让它沉着。不想解释，也不想好起来",summary:"{name}把「我最近不太好」打了又删，最后只回了句「没事」。有些日子就是这样，先沉着",effects:[],addTags:["low_mood","low_mood_ever"]},{text:"撑一撑，先把今天过完",summary:"{name}把闹钟往前调了十分钟，给自己留了点发呆的空。日子紧，但还没断",effects:[{attr:"stress",delta:1}]}]},{id:"mood_self_care",category:"life",title:"一个人待着的下午",text:"难得的空档。{name}盯着天花板想了一会儿，决定不刷手机了——哪怕只是把屋子收拾出来一角，或者出门走到天黑。",minAge:18,maxAge:70,cooldown:2,weight:18,requires:{tagsAny:["low_mood"]},choices:[{text:"收拾屋子，睡一个长觉",summary:"床单换成了晒过的那套。{name}下午四点躺下，一觉睡到深夜——醒来时屋里很静，静得刚好",effects:[{attr:"happiness",delta:2}]},{text:"出门，一直走到天黑再回来",summary:"{name}沿着河走了很远，路灯一盏盏亮起来。腿很酸，但脑子第一次这么安静",effects:[{attr:"happiness",delta:1},{attr:"stress",delta:-1}]}]},{id:"mood_talk",category:"life",title:"话到嘴边",text:"有人发消息问{name}：「最近怎么样？」就这五个字，{name}盯着看了很久。说，还是不说？",minAge:18,maxAge:70,cooldown:2,weight:18,requires:{tagsAny:["low_mood"],relationKinds:["friend","partner","spouse"]},choices:[{text:"说了。把最近的状态，原原本本说了",summary:"说完{name}觉得有点傻，对方却只回了句：「谢谢你愿意告诉我。」原来开口本身，就已经是在往回走了",effects:[{attr:"happiness",delta:3}],removeTags:["low_mood"]},{text:"话到嘴边，只是陪着对方坐了坐",summary:"{name}最终没说。但那顿饭吃得很慢，有个人在旁边，好像也没那么难熬",effects:[{attr:"happiness",delta:1}]}]},{id:"mood_professional",category:"life",title:"存下的那个号码",text:"{name}其实早就存了那个号码——心理咨询的预约电话。一直没打。今天盯着它看了很久，想：要不，就当是给车子做次保养？",minAge:18,maxAge:70,cooldown:2,weight:18,requires:{tagsAny:["low_mood"]},choices:[{text:"打了。约了第一次咨询",tooltip:"800 元/次",summary:"电话只响了两声就通了。挂断后{name}长出一口气——最难的一步已经迈出去了。第一次咨询只有一个小时，但那一小时里，{name}说的话比过去半年都多",effects:[{money:-800},{attr:"happiness",delta:4}],removeTags:["low_mood"]},{text:"又把手机扣下了。还没准备好",summary:"{name}把号码又存了一遍，好像这样能更近一点。没关系的，号码在那里，随时可以打",effects:[{attr:"happiness",delta:-1}]}]},{id:"mood_clear_sky",category:"life",title:"那阵子，好像过去了",text:"{name}是在晾衣服的时候发现的：哼了一句歌。不成调，但确实是哼出来的。这种小事最近多起来了——一顿吃得香的饭，一段睡得沉的觉。",minAge:18,maxAge:70,cooldown:4,weight:14,requires:{tagsAny:["low_mood"],minAttr:{happiness:55}},choices:[{text:"……好像缓过来了",summary:"{name}没有庆祝，只是把窗帘拉开了。那阵子过去了。如果它再来，{name}知道该找谁、该做什么",effects:[],removeTags:["low_mood"]},{text:"先别急着翻篇，再稳一稳",summary:"{name}把「好了」两个字咽了回去。慢慢来，不着急给这段时间下结论",effects:[{attr:"happiness",delta:1}]}]}],o1=[{id:"par_interest_class",category:"life",title:"周六早上的兴趣班",text:"孩子盯着少年宫宣传单上的画，眼睛亮了一下，又很快收回去——像怕给家里添麻烦。{name}把那张单子抚平，收进了口袋。",minAge:25,maxAge:45,cooldown:4,weight:12,requires:{childStage:{atLeast:5,below:12},tagsNone:["dink"]},choices:[{text:"先报个零基础体验班",tooltip:"2,000 元",summary:"第一节课，孩子攥着蜡笔不肯撒手。回家的路上话比过去一个月都多",effects:[{money:-2e3},{relation:{kind:"child",deltaCloseness:3,milestoneTarget:!0}}],addTags:["parenting_active"]},{text:"咬咬牙，报进阶小班",tooltip:"2,800 元",summary:"小班八个人，老师记得住每个名字。孩子把第一张「作品」贴在了冰箱正中央",effects:[{money:-2800},{attr:"happiness",delta:1},{relation:{kind:"child",deltaCloseness:3,milestoneTarget:!0}}],addTags:["parenting_active"]}]},{id:"par_teen_door",category:"life",title:"紧闭的房门",text:"孩子回家就进屋，门关得比外面天气还冷。饭桌上只剩筷子碰碗的声音。{name}在他门口站了一会儿，手举起来，又放下。",minAge:30,maxAge:50,cooldown:3,weight:12,requires:{childStage:{atLeast:12,below:15},tagsNone:["dink"]},choices:[{text:"还是敲了门，进去坐下聊",summary:"一开始只有「嗯」「还行」。聊到第三十分钟，孩子忽然说起学校里的事，说着说着就停不下来了",effects:[{attr:"happiness",delta:1},{relation:{kind:"child",deltaCloseness:4,milestoneTarget:!0}}],addTags:["parenting_active"]},{text:"把门轻轻带上，给他空间",summary:"{name}在门口贴了张字条：「汤在锅里。」那晚孩子自己出来盛了汤，还把碗洗了",effects:[{attr:"stress",delta:-2},{relation:{kind:"child",deltaCloseness:2,milestoneTarget:!0}}],addTags:["parenting_active"]}]},{id:"par_form_night",category:"life",title:"填报前夜",text:"志愿表摊在灯下。孩子铅笔悬着，回头看了一眼{name}——那一眼里的意思很复杂：想听你的意见，又怕你替他做主。",minAge:38,maxAge:56,once:!0,weight:14,requires:{childStage:{atLeast:17,below:19},tagsNone:["dink"]},choices:[{text:"全力托举：想读，就一直读下去",summary:"{name}把一句话放在了桌面上：「家里的事不用你操心，你只管往前走。」孩子低头填了下去，笔迹很稳",effects:[],addTags:["child_path_academic","parenting_active"]},{text:"陪他看了职业院校：手艺是铁饭碗",summary:"一家三口跑了两天招生点。孩子摸着实训车间的机床不肯走——{name}知道，这就是对的路",effects:[],addTags:["child_path_vocational","parenting_active"]},{text:"他心意已决：早点自立，家里尊重",summary:"孩子说想先工作。{name}沉默了一会儿，伸出手：「那就签好你的第一份合同。」",effects:[],addTags:["child_path_work","parenting_active"]}]},{id:"par_path_visible",category:"life",title:"他自己选的路上",text:"这些年家里安静了不少，孩子按当年那张表走出了很远。{name}偶尔想起填报前夜那盏灯——不知道当年那一下，算不算扶对了地方。",minAge:47,maxAge:65,once:!0,weight:10,requires:{childStage:{atLeast:22},tagsAny:["child_path_academic","child_path_vocational","child_path_work"],tagsNone:["dink"]},choices:[{text:"行李箱上贴着托运标签——他又出发去念书了",requires:{tagsAny:["child_path_academic"]},summary:"视频里孩子举着录取通知，身后是陌生城市的站台。{name}嘴上说着「行李带够了没有」，眼眶先热了",effects:[{attr:"happiness",delta:1},{relation:{kind:"child",deltaCloseness:2,milestoneTarget:!0}}]},{text:"录用通知，和他亲手领来的第一套工具",requires:{tagsAny:["child_path_vocational"]},summary:"孩子把录用通知摆在饭桌正中，工具包擦得锃亮。手艺人的饭碗，端得稳",effects:[{relation:{kind:"child",deltaCloseness:3,milestoneTarget:!0}}]},{text:"他用第一份工资，给家里换了台冰箱",requires:{tagsAny:["child_path_work"]},summary:"新冰箱嗡嗡地响，孩子挠着头说「先尽着你们用」。{name}转身进了厨房，好一会儿才出来",effects:[{attr:"stress",delta:-1},{relation:{kind:"child",deltaCloseness:2,milestoneTarget:!0}}]},{text:"无论哪条路，都是他自己在走",summary:"{name}没再多问。当年灯下那一眼，如今有了自己的答案",effects:[{attr:"happiness",delta:2}]}]}],c1=[{id:"wl_office_deskmate",category:"career",title:"工位隔壁的人",text:"隔壁工位那张脸，{name}看了大半年，说过的话不超过十句。今天加班等外卖的空档，对方忽然递过来一包辣条：「吃不吃？加点油。」",minAge:22,maxAge:55,cooldown:4,weight:12,requires:{careerKinds:["employed"],relationKindsNone:["colleague"]},choices:[{text:"接了。聊起来才知道就住隔壁小区",summary:"从辣条聊到房贷，从房贷聊到老家。下班时{name}知道了TA叫什么、工位椅子上那个靠垫是TA妈妈缝的",effects:[{relation:{kind:"colleague",add:!0,closeness:50}}]},{text:"笑着摆摆手，先把报表赶完",summary:"辣条在桌上放到下班。第二天{name}路过隔壁工位，把一盒酸奶放下——有些认识，晚一拍也开始",effects:[{attr:"stress",delta:-1},{relation:{kind:"colleague",add:!0,closeness:40}}]}]},{id:"wl_new_neighbor",category:"life",title:"对门搬来的一家人",text:"对门响了一整天的搬家声，傍晚忽然安静了。{name}出门倒垃圾，正撞上对方抱着纸箱站在门口，进退两难。",minAge:20,maxAge:70,cooldown:4,weight:12,requires:{relationKindsNone:["neighbor"]},choices:[{text:"搭把手，帮着抬了一趟",summary:"箱子不重，人情落了地。对方非塞给{name}两个自家蒸的包子，说以后就是对门了",effects:[{relation:{kind:"neighbor",add:!0,closeness:45}}]},{text:"点头笑了笑，各自忙",summary:"后来在电梯里碰见，会点头，会替对方按住开门键。邻居嘛，慢慢处",effects:[{relation:{kind:"neighbor",add:!0,closeness:35}}]}]},{id:"wl_late_night",category:"career",title:"并肩的加班夜",text:"十点半的办公室只剩两盏灯。隔壁工位的TA伸了个懒腰，屏幕的光打在脸上：「第几版了？我这版改完就走。」",minAge:23,maxAge:50,cooldown:3,weight:10,requires:{careerKinds:["employed"],relationKinds:["colleague"]},choices:[{text:"一起等到末班车",summary:"站台的风很凉，两个人分了一副耳机。有些友情不靠饭局，靠的是一起熬过的夜",effects:[{attr:"happiness",delta:1},{relation:{kind:"colleague",deltaCloseness:3}}]},{text:"TA被甩锅的时候，帮着顶了一下",summary:"会上{name}把时间线讲清楚了。散会后TA在楼梯间说了声谢，眼神里有话没说完",effects:[{attr:"stress",delta:2},{relation:{kind:"colleague",deltaCloseness:4}}]}]},{id:"wl_one_seat",category:"career",title:"只有一个名额",text:"部门公示栏贴出来那一刻，{name}和TA都看见了：外派培训，名额一个。两个人实力相当，资历相当，连沉默都相当。",minAge:24,maxAge:50,cooldown:4,weight:10,requires:{careerKinds:["employed"],relationKinds:["colleague"]},choices:[{text:"各凭本事，公平竞争",summary:"那一个月两个人说话都客气得发紧。结果出来那天，赢的人请了奶茶，输的人说「下次我请回来」——还是朋友，只是都憋着一口气",effects:[{attr:"stress",delta:3},{relation:{kind:"colleague",deltaCloseness:-2}}]},{text:"退一步，把机会让给TA",summary:"{name}找了理由撤了申报。TA知道后追到楼梯间，半天憋出一句「这顿饭我记下了」。有些账，朋友之间不算利息",effects:[{attr:"happiness",delta:-1},{relation:{kind:"colleague",deltaCloseness:4}}]}]},{id:"wl_farewell_dinner",category:"career",title:"散伙饭",text:"{name}离开公司那天，TA在群里喊了一嗓子：「今晚老地方，谁有空谁来。」到场的还是那几个老人。",minAge:24,maxAge:60,cooldown:4,weight:12,requires:{careerKinds:["unemployed"],relationKinds:["colleague"]},choices:[{text:"碰杯，正式道别",summary:"饭桌上把工牌的挂绳传着看了一圈。「以后常联系」说了很多遍——有些会兑现，有些就成了那句客气话",effects:[{attr:"happiness",delta:-1},{relation:{kind:"colleague",remove:!0}}],addTags:["ex_colleague"]},{text:"不道别。以后常联系，就不是散伙",summary:"{name}和TA单独加了下一场。不在一个公司了，朋友还能是朋友",effects:[{relation:{kind:"colleague",deltaCloseness:2}}]}]},{id:"wl_hallway_chat",category:"life",title:"楼道的闲聊",text:"垃圾房前遇上对门的TA，手里都拎着袋子。「吃了吗？」——楼道里的社交，从这三个字开始，也可以只到这三个字。",minAge:20,maxAge:70,cooldown:2,weight:10,requires:{relationKinds:["neighbor"]},choices:[{text:"站着聊了一会儿",summary:"从垃圾分类聊到孩子考试，十分钟过去，袋子勒手都忘了。楼道里的十分钟，比朋友圈一年都实在",effects:[{attr:"happiness",delta:1},{relation:{kind:"neighbor",deltaCloseness:2}}]},{text:"TA硬塞了一把自家种的青菜",summary:"推了两轮没推掉。晚上那盘清炒青菜，甜的",effects:[{relation:{kind:"neighbor",deltaCloseness:3}}]}]},{id:"wl_renovation_noise",category:"life",title:"电钻从早上八点开始",text:"对门装修第三天，电钻声准时穿透墙面。{name}顶着两个黑眼圈站在玄关，手里的门钥匙转了两圈，又停住。",minAge:22,maxAge:65,cooldown:4,weight:10,requires:{relationKinds:["neighbor"]},choices:[{text:"忍了，戴上去上班",summary:"耳机音量调到最大。晚上回来，门口多了袋对方塞的橘子——他们心里也有数",effects:[{attr:"stress",delta:2}]},{text:"敲开门，好好说了",summary:"对方一个劲道歉，说中午午休时段一定停工。谈开了反而轻松——邻居之间，话比纸条管用",effects:[{attr:"stress",delta:-1},{relation:{kind:"neighbor",deltaCloseness:1}}]}]},{id:"wl_good_neighbor",category:"life",title:"远亲不如近邻",text:"那几天家里冷锅冷灶。门铃响的时候，{name}以为是快递——门口站着对门的TA，手里端着还冒热气的砂锅：「给孩子和自己，趁热。」",minAge:25,maxAge:70,cooldown:6,weight:10,requires:{relationKinds:["neighbor"],minCloseness:{neighbor:50},tagsAny:["low_mood","grief_pet","been_deep_debt"]},choices:[{text:"收下这口热饭，记着这份情",summary:"砂锅还回去的时候装了自己炖的汤。一来一往，楼道里的「吃了吗」，从此是真的在问",effects:[{attr:"stress",delta:-2},{relation:{kind:"neighbor",deltaCloseness:2}}]},{text:"洗了TA的砂锅，又给装满了",summary:"礼尚往来不是客气，是把这个「近」字处成真的。两家人后来钥匙都互相存了一把",effects:[{relation:{kind:"neighbor",deltaCloseness:3}}]}]}],d1=[{id:"ven_quit_resign",category:"career",title:"辞职去创业",text:"那个想法{name}养了三年——夜里睡不着的时候，它就在脑子里发光。银行卡里的数字，第一次够得上「试试」的门槛。桌上的辞职信，打印好了，就差签名。",minAge:25,maxAge:45,once:!0,weight:14,requires:{careerKinds:["employed"],moneyAtLeast:3e4},choices:[{text:"签了。从今天起，给自己打工",tooltip:"投入全部积蓄 30,000 元；没有退路，也没有天花板",summary:"交辞职信那天手有点抖，走出办公楼却觉得天特别大。{name}给自己的小店想了个名字，注册那天，字签得又慢又用力",effects:[{loseJob:!0},{money:-3e4}],addTags:["entrepreneur"]},{text:"再攒攒，还没到时候",summary:"辞职信锁回了抽屉最底层。夜里那个想法还在发光——再攒攒，总会到的",effects:[{attr:"happiness",delta:-1}]}]},{id:"ven_first_year",category:"career",title:"启动的那半年",text:"营业执照上的名字还带着油墨味。房租、装修、第一批货——每一项都在跟{name}要钱，而账上的数字一天比一天诚实。",minAge:25,maxAge:48,once:!0,weight:12,requires:{tagsAny:["entrepreneur"]},choices:[{text:"按计划来：铺面、装修、第一批货",tooltip:"未来三年每年投入 20,000 元",effects:[],summary:"{name}把计划表贴在墙上，三期投入一期不少。账很疼，但每一步都踩在自己画的线上",delayed:[{years:1,money:-2e4,summary:"铺面第一年的投入，交出去的时候手都是稳的"},{years:2,money:-2e4,summary:"第二批货款+租金，生意像样了一点"},{years:3,money:-2e4,summary:"第三期投入——撑过这一年，就算站稳了"}]},{text:"轻一点：先从线上小生意试水",tooltip:"未来三年每年投入 8,000 元",effects:[{attr:"stress",delta:-1}],summary:"{name}把客厅一角改成了打包台。小本生意，试的是水，也是自己",delayed:[{years:1,money:-8e3,summary:"第一年的试水成本，包装盒堆到了天花板"},{years:2,money:-8e3,summary:"回头客多起来了，投入也跟着加了一点"},{years:3,money:-8e3,summary:"第三年——小店的名声，是打包台上一单一单攒出来的"}]}]},{id:"ven_first_profit",category:"career",title:"第一笔进账",text:"手机震了一下，到账短信跳出来。{name}盯着那个数字看了很久——不是大钱，是第一笔别人为{name}的东西付的钱。",minAge:25,maxAge:50,cooldown:2,weight:12,requires:{tagsAny:["entrepreneur"],ventureProfit:!0},choices:[{text:"落袋。这一笔，存起来",summary:"{name}开了个新的账户专门存它。数字不大，意义全是自己的——原来真的有人愿意为这件事付钱",effects:[{money:24e3},{attr:"happiness",delta:2}]},{text:"滚动进去，把钱变成下一批货",summary:"到账当天{name}就下了原料单。钱过一遍手就变成了仓库里的货——生意就该是这个转法",effects:[{money:24e3},{attr:"stress",delta:1}],delayed:[{years:1,money:-16e3,summary:"原料款如约划出，换回来的是更厚的订单"}]}]},{id:"ven_scale_or_hold",category:"career",title:"扩张还是守住",text:"小店 steady 跑了一年，账上第一次有了余钱。隔壁铺面的招租电话来得正好——扩，还是不扩？{name}在计算器上按了又清，清了又按。",minAge:26,maxAge:50,once:!0,weight:12,requires:{tagsAny:["entrepreneur"]},choices:[{text:"扩张：把隔壁铺面拿下来",tooltip:"未来两年每年投入 25,000 元；更大的场子，更大的风浪",summary:"{name}在租约上签了字。新铺面的钥匙很凉，心很热——生意人总要有一次押上家的时刻",effects:[{attr:"stress",delta:3}],delayed:[{years:1,money:-25e3,summary:"新铺面的装修与押金，押上的是这三年攒下的底气"},{years:2,money:-25e3,summary:"两家店同时转，{name}瘦了一圈，眼睛却越来越亮"}]},{text:"守住：把这一家店做深",summary:"{name}婉拒了招租电话，转头把老店的货架子重新排了一遍。稳稳的小利，稳稳的睡得着觉",effects:[],delayed:[{years:1,money:12e3,summary:"老客带新客，年底一算，比去年多了这一笔"},{years:2,money:12e3,summary:"小店的口碑在街坊里立住了——慢，但是自己的"}]}]},{id:"vent_close_day",category:"career",title:"关门的那天",text:"账算到第三遍，数字还是那个数字。{name}把卷帘门拉下来一半，站在半明半暗的店里，做了个决定。",minAge:25,maxAge:52,cooldown:3,weight:12,requires:{tagsAny:["entrepreneur"],ventureClose:!0},choices:[{text:"正式关门。这段路不算白走",summary:"卷帘门落锁的声音很轻。{name}把招牌小心拆下来包好——这段路不算白走，下一次走路，脚底会有数",effects:[{attr:"happiness",delta:-4}],addTags:["biz_failed"]},{text:"再撑一撑，把库清完再说",summary:"{name}把关门的日子又往后推了推。清仓的横幅挂出去，进店的人反而多了两个——先撑过这个季度",effects:[{attr:"stress",delta:3}]}]},{id:"vent_back_to_work",category:"career",title:"重新上班的人",text:"简历上那段「自主创业」写了两行。面试官盯着看了很久，问了个{name}没想到的问题：「这两年，你最大的教训是什么？」{name}笑了——这个能聊一整天。",minAge:26,maxAge:55,once:!0,weight:14,requires:{tagsAny:["biz_failed"]},choices:[{text:"带着这段经历去面试老本行",summary:"面试官听完那段教训，在简历上圈了个记号。{name}走出门的时候知道：创业教会的东西，职场也认",effects:[{addSkill:{id:"academics",delta:3}},{attr:"happiness",delta:1}]},{text:"先接零工过渡，边走边看",summary:"{name}接了几单零工，钱不多，日子却重新转起来了。停下来的人才输，走着的人都在路上",effects:[{money:3e3},{attr:"stress",delta:1}]}]}],u1=[{id:"ny_where",category:"life",title:"今年的年在哪过",text:"腊月一到，日历上的那个日子就开始发烫。回家的票、留守的班、母亲发来的腊味清单——{name}对着手机算了又算，这道题每年都要重答一遍。",minAge:31,maxAge:58,cooldown:3,weight:12,requires:{cityIn:["metro","province"],tagsNone:["married"]},choices:[{text:"回家。票再难抢也要回",tooltip:"春运路费 1,500 元",summary:"拖着一箱年货挤上车， hometown 的站牌亮起来那一刻，一年的疲惫都值了",effects:[{money:-1500},{attr:"stress",delta:-2},{relation:{kind:"parent",deltaCloseness:2}}],addTags:["home_for_ny"]},{text:"留在城市，把路费变成加班费",summary:"留城的年夜，{name}给自己点了顿好的。视频里给爸妈拜了年——不是不想回，是这年在城里也有它的过法",effects:[{money:2e3},{attr:"happiness",delta:-3}],addTags:["ny_stay_town"]}]},{id:"ny_questions",category:"life",title:"饭桌上的提问环节",text:"年夜饭的筷子还没放下，问题就一个接一个上桌了。姑姑问收入，舅妈问个人问题，连表弟都凑热闹。{name}夹了一筷子菜，脑内飞速排兵布阵。",minAge:26,maxAge:58,cooldown:3,weight:10,requires:{tagsAny:["home_for_ny"]},choices:[{text:"打太极，「还行还行，吃菜吃菜」",summary:"四个「还行」挡下了三轮攻势。姑姑们似乎也满意了——她们要的也许不是答案，是这来来回回的热闹",effects:[{attr:"stress",delta:1}]},{text:"实话实说，一句是一句",summary:"{name}把近况原原本本说了。饭桌上安静了几秒，然后姥姥夹了个鸡腿过来：「实话好。日子是自己过的。」如释重负",effects:[{attr:"happiness",delta:-1},{attr:"stress",delta:-2}]}]},{id:"ny_stay_dinner",category:"life",title:"年三十的这顿饭",text:"城市在今晚难得地安静下来，窗外偶尔炸开几朵烟花。{name}的年夜饭，得认真对待——一年就这一顿，在哪儿吃、跟谁吃，都是讲究。",minAge:26,maxAge:58,cooldown:3,weight:10,requires:{tagsAny:["ny_stay_town"]},choices:[{text:"一人食也要四个菜，给自己撑场面",tooltip:"采买 500 元",summary:"硬菜两个、素菜两个、汤一个，摆满一桌。{name}拍了张照发家族群，配文「一切都好」。一个人的年，也过得像模像样",effects:[{money:-500},{attr:"happiness",delta:1}]},{text:"跟爸妈视频守岁，隔着屏幕碰杯",summary:"屏幕那头在放春晚，母亲非要举着饺子对着镜头「干杯」。隔着六百公里，年三十的钟声是一起听的",effects:[{attr:"happiness",delta:1},{attr:"stress",delta:-1}]},{text:"同事喊了一起了年",requires:{relationKinds:["colleague"]},summary:"TA家客厅挤满了同样留城的年轻人，饺子包了三种馅。午夜十二点，一群人举着饮料碰杯——「明年都更好」",effects:[{attr:"happiness",delta:2},{relation:{kind:"colleague",deltaCloseness:2}}]}]}],m1=[{id:"persona_shift_moment",category:"life",title:"你变了",text:"深夜整理旧物，翻出一张多年前的照片。照片里那个人眉眼飞扬，做什么都不管不顾。{name}看了很久，忽然分不清——是那个人走了太远，还是自己走得太远。",minAge:30,maxAge:70,once:!0,weight:2,requires:{tagsAny:["been_deep_debt","divorced","biz_failed","marriage_mended"],tagsNone:["persona_shifted"]},choices:[{text:"承认吧，我变了",summary:"{name}把照片摆上了架。变了就变了——那个人帮自己扛住了最难的日子，如今换一张更沉得住气的脸，接着走",effects:[{attr:"happiness",delta:2}],addTags:["persona_shifted"]},{text:"我还是我。只是走了段远路",summary:"{name}把照片放回了盒子里，扣上盖子时很轻。没变，只是走了段远路——这话对不对，交给往后的日子",effects:[]}]},{id:"persona_echo",category:"life",title:"老朋友说你也变了",text:"老朋友来家里坐，聊到一半忽然说：「你变了，你知道吗？以前你……」TA比了个含糊的手势，没说下去。{name}等TA把话说完。",minAge:30,maxAge:70,cooldown:6,weight:10,requires:{tagsAny:["persona_shifted"],relationKinds:["friend"]},choices:[{text:"笑着承认：「变了，变多了」",summary:"老朋友愣了一下，笑了：「挺好。现在的你，看着踏实。」有些变化，被人看出来的那一刻才算数",effects:[{attr:"happiness",delta:1},{relation:{kind:"friend",deltaCloseness:2}}]},{text:"嘴硬：「哪有，还是老样子」",summary:"老朋友撇撇嘴没拆穿，又给{name}续了茶。嘴上不认，杯子里的热气是诚实的",effects:[{relation:{kind:"friend",deltaCloseness:1}}]}]}],f1=[{id:"era4_jobs_dawn",category:"career",title:"凌晨的招聘软件",text:"失眠的夜里，{name}点开了那个很久没动的招聘软件。滑动，收藏，再滑动——有三家公司标注「急聘」，有两家薪资比现在高。凌晨两点的勇气，天亮之后还算不算数？",minAge:28,maxAge:35,cooldown:5,weight:8,choices:[{text:"收藏三家，先去睡",summary:"{name}按住心动的薪资关掉手机。收藏夹不会过期，觉要紧——机会和睡眠，都得养着",effects:[{attr:"stress",delta:-1}]},{text:"顺手改了改简历",summary:"改到第三版，{name}忽然发现这两年攒下的东西比想象中多。存进草稿箱，安心睡去",effects:[{attr:"happiness",delta:1}]}]},{id:"era4_group_buy",category:"life",title:"小区团购群",text:"群里的接龙从早上排到晚上：今天的西瓜、明天的排骨、后天到货的纸巾。{name}本来只想买一颗白菜，划着划着，购物清单长出了七八行。",minAge:48,maxAge:55,cooldown:5,weight:8,choices:[{text:"跟上接龙，顺手帮邻居带了棵葱",summary:"取货点就在楼下驿站，{name}拎着两袋东西上楼，袋子上还贴着邻居的便签「谢谢侬」——群里的热闹，落到了实处",effects:[{money:-200},{attr:"happiness",delta:1}]},{text:"只买最初那颗白菜，把群设了免打扰",summary:"{name}退回购物车把多余的一行行删掉——白菜很甜，清净也很甜",effects:[{attr:"stress",delta:-1}]}]},{id:"era4_ny_delivery",category:"life",title:"年货到门的那个下午",text:"快递驿站的货架从地面堆到齐腰，红色包装盒占了一半。{name}的年货也是线上下的单——父母那边的腊味今天显示「派送中」，自己这箱坚果昨天就到了。",minAge:26,maxAge:58,cooldown:5,weight:8,choices:[{text:"给家里再补一箱水果，写张卡片",summary:"卡片是下单时免费加的，字数有限，{name}只写了四个字：「爸，妈，新年。」——够了，都懂",effects:[{money:-300},{attr:"happiness",delta:1}]},{text:"抱着自己那箱回家，先吃为敬",summary:"坚果开口器都配好了，{name}当晚就开了一包。年味这个东西，有时候是从一口酥脆开始的",effects:[{attr:"happiness",delta:1}]}]}],p1=[{id:"lk_spouse_venture",category:"relationship",title:"TA对这门生意的态度",text:"店里忙到打烊，TA来送饭，看着满屋的货箱欲言又止。创业这半年，TA的态度，{name}一直想听个明白。",minAge:28,maxAge:48,cooldown:4,weight:10,requires:{tagsAny:["entrepreneur"],relationKinds:["spouse"]},choices:[{text:"摊开账本，TA看完说「算我一个」",summary:"TA连夜做了张进货表。两口子守店到深夜，累，但从未这么齐心地累过",effects:[{attr:"happiness",delta:2},{relation:{kind:"spouse",deltaCloseness:2}}]},{text:"TA担心，两人约定一条止损线",summary:"「亏到这里为止。」TA在纸上画了条线。有了这条线，{name}反而敢放手干了",effects:[{attr:"stress",delta:-1},{relation:{kind:"spouse",deltaCloseness:1}}]}]},{id:"lk_venture_ny",category:"life",title:"创业后的第一个年",text:"所有人都在问{name}：「店怎么样了？」——回不回家，这一年有了新的分量。",minAge:26,maxAge:50,cooldown:4,weight:10,requires:{tagsAny:["entrepreneur"]},choices:[{text:"关门三天，也要回家",tooltip:"路费与年货 1,500 元",summary:"歇业告示贴出去，{name}回了家。亲戚们的追问五花八门，但母亲的年夜饭一入口，什么都值了",effects:[{money:-1500},{attr:"happiness",delta:1},{attr:"stress",delta:-1}]},{text:"留守看店，春节正是旺季",summary:"{name}除夕夜在店里贴了副春联。营业额是平时的三倍——有些年，是在算盘声里过的",effects:[{money:1500},{attr:"stress",delta:2}]}]},{id:"lk_mood_work",category:"life",title:"低谷期的上班路",text:"情绪沉在谷底的日子里，办公室的灯照旧要开。{name}工位上堆着活，心里空着一块——这一天怎么过，可以有讲究。",minAge:24,maxAge:55,cooldown:4,weight:10,requires:{tagsAny:["low_mood"],careerKinds:["employed"]},choices:[{text:"请半天假，去公园坐坐",summary:"{name}跟主管直说了「状态不好，想歇半天」。阳光落在长椅上的时候，呼吸顺了一些",effects:[{attr:"stress",delta:-2}]},{text:"照常上班，只做最顺手的活",summary:"{name}把难题都往后排，先清了三件小事。清单划掉的那一刻，好像找回了一点掌控",effects:[{attr:"happiness",delta:-1},{attr:"stress",delta:1}]}]},{id:"par_kid_city",category:"life",title:"在大城市长大的孩子",text:"周末的博物馆里，孩子趴在玻璃柜前不肯走。{name}忽然意识到：这孩子的童年，是地铁、展馆和城市公园拼起来的——和自己的童年完全两个样。",minAge:30,maxAge:48,cooldown:4,weight:10,requires:{tagsAny:["parenting_active"],relationKinds:["child"],cityIn:["metro"]},choices:[{text:"办张年卡，周末就往展馆跑",tooltip:"年卡 800 元",summary:"孩子能背出每个展厅的明星展品。{name}的工资卡在瘦，孩子的眼睛在亮",effects:[{money:-800},{attr:"happiness",delta:1},{relation:{kind:"child",deltaCloseness:2}}]},{text:"视频给老家祖辈「展览」一下",summary:"镜头前孩子讲得眉飞色舞，老家的祖辈连连点头：「这娃，见世面了。」两代人的距离，被一块屏幕拉近",effects:[{attr:"happiness",delta:1}]}]},{id:"wl_col_fame",category:"career",title:"同事刷到了你的号",text:"茶水间里，同事举着手机凑过来：「这个博主怎么跟你长得一模一样？——等等，就是你啊！」账号的事，在公司传开了。",minAge:22,maxAge:50,cooldown:4,weight:10,requires:{tagsAny:["minor_fame"],relationKinds:["colleague"]},choices:[{text:"大方承认，合了个影",summary:"合影发进部门群，点赞刷了屏。主管路过看了一眼，留下一句「下班别耽误」——也算默许了",effects:[{attr:"happiness",delta:2}]},{text:"轻描淡写：「玩玩而已」",summary:"{name}把话题引回了工作。但午休时，TA凑过来说了句悄悄话：「那条探店视频，我转给我对象了，她关注了。」",effects:[{relation:{kind:"colleague",deltaCloseness:2}}]}]},{id:"will_sibling_table",category:"life",title:"老屋的饭桌",text:"回老家办事，兄弟姐妹难得凑齐一桌。酒过三巡，{name}想起自己签了字的遗嘱——这份安排，说，还是不说？",minAge:60,maxAge:77,once:!0,weight:9,requires:{tagsAny:["will_mode_even","will_mode_weighted","will_mode_grandchild"],relationKinds:["sibling"]},choices:[{text:"摊开说，把自己的安排讲明白",summary:"桌上安静了一阵，大哥先开了口：「你想得周全。」一件事摊在阳光下，反倒谁的心里都不存疙瘩了",effects:[{attr:"stress",delta:-2},{relation:{kind:"sibling",deltaCloseness:3}}]},{text:"烂在肚子里，说早了伤和气",summary:"{name}把话就着酒咽了下去。有些安排，也许永远不必说出口——但今夜的酒，喝得有点沉",effects:[{attr:"stress",delta:1}]}]},{id:"elder_sibling_care",category:"life",title:"手足的探望",text:"换了个住法之后，兄弟姐妹的探望成了固定节目。TA带着一兜子水果站在门口，进门先打量了一圈：「住这儿，习惯吗？」",minAge:60,maxAge:75,cooldown:4,weight:10,requires:{tagsAny:["elder_home","elder_institution"],relationKinds:["sibling"]},choices:[{text:"带着TA四处转转，说说近况",summary:"从伙食讲到棋友，TA听完放了心，临走留下两千块钱：「买点爱吃的。」推让半天，还是收下了",effects:[{attr:"happiness",delta:1},{relation:{kind:"sibling",deltaCloseness:2}}]},{text:"电话里把养老分工商量明白",summary:"谁出钱、谁跑腿、谁常来看——三件事摆上桌面，一件件说定。话说明白了，情分反而更近",effects:[{attr:"stress",delta:-1},{relation:{kind:"sibling",deltaCloseness:1}}]}]},{id:"persona_after_close",category:"life",title:"把教训装订成册",text:"关店满一年了。{name}整理仓库 leftovers 时翻出一摞便签——进货的心得、看走眼的客户、差三天就回款的订单。变了性子的{name
